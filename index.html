<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DollarMaker Trading</title>
</head>
<body>
  <h1>DollarMaker Trading</h1>
  <p>Connect your Deriv account to continue.</p>

  <button id="connectButton">Connect to Deriv</button>
  <p id="message"></p>

  <script>
    const APP_ID = "34cn5UV9swRtd82SWTJk9";
    const REDIRECT_URI =
      "https://ddenno021-sketch.github.io/Deriv-trading-bot/";

    function base64url(bytes) {
      let binary = "";
      bytes.forEach(byte => {
        binary += String.fromCharCode(byte);
      });

      return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
    }

    async function connectToDeriv() {
      const message = document.getElementById("message");
      const button = document.getElementById("connectButton");

      try {
        button.disabled = true;
        message.textContent = "Connecting to Deriv...";

        if (!window.crypto || !window.crypto.subtle) {
          throw new Error(
            "Secure browser support is required. Open this website using HTTPS in Chrome."
          );
        }

        const randomBytes = crypto.getRandomValues(
          new Uint8Array(32)
        );

        const codeVerifier = base64url(randomBytes);

        const encoder = new TextEncoder();
        const hash = await crypto.subtle.digest(
          "SHA-256",
          encoder.encode(codeVerifier)
        );

        const codeChallenge = base64url(
          new Uint8Array(hash)
        );

        sessionStorage.setItem(
          "deriv_code_verifier",
          codeVerifier
        );

        const params = new URLSearchParams({
          response_type: "code",
          client_id: APP_ID,
          redirect_uri: REDIRECT_URI,
          code_challenge: codeChallenge,
          code_challenge_method: "S256"
        });

        window.location.href =
          "https://oauth.deriv.com/oauth2/authorize?" +
          params.toString();

      } catch (error) {
        message.textContent = error.message;
        button.disabled = false;
      }
    }

    document.getElementById("connectButton")
      .addEventListener("click", connectToDeriv);
  </script>
</body>
</html>
