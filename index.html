<!DOCTYPE html>
<html>
<head>
  <title>My Deriv Trading Site</title>
</head>

<body>
  <h1>My Deriv Trading Site</h1>
  <p>Welcome to my website</p>

  <button id="connectDeriv">Connect to Deriv</button>

  <script>
    const CLIENT_ID = "34cn5UV9swRtd82SWTJk9";
    const REDIRECT_URI = "https://ddenno021-sketch.github.io/Deriv-trading-bot/";

    document.getElementById("connectDeriv").addEventListener("click", async () => {

      const array = crypto.getRandomValues(new Uint8Array(64));

      const codeVerifier = Array.from(array)
        .map(v => "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~"[v % 66])
        .join("");

      const hash = await crypto.subtle.digest(
        "SHA-256",
        new TextEncoder().encode(codeVerifier)
      );

      const codeChallenge = btoa(
        String.fromCharCode(...new Uint8Array(hash))
      )
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");

      const state = crypto.getRandomValues(new Uint8Array(16))
        .reduce((s, b) => s + b.toString(16).padStart(2, "0"), "");

      sessionStorage.setItem("pkce_code_verifier", codeVerifier);
      sessionStorage.setItem("oauth_state", state);

      const authUrl = new URL("https://auth.deriv.com/oauth2/auth");

      authUrl.searchParams.set("response_type", "code");
      authUrl.searchParams.set("client_id", CLIENT_ID);
      authUrl.searchParams.set("redirect_uri", REDIRECT_URI);
      authUrl.searchParams.set("scope", "trade");
      authUrl.searchParams.set("state", state);
      authUrl.searchParams.set("code_challenge", codeChallenge);
      authUrl.searchParams.set("code_challenge_method", "S256");

      window.location.href = authUrl.toString();
    });
  </script>
</body>
</html>
